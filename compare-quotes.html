<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Quotes — LIFELINK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
            },
            slate: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .filter-btn-active {
      background-color: #059669;
      color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }
    .modal-backdrop {
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 antialiased selection:bg-emerald-100 selection:text-emerald-800" data-ll-page="compare" data-ll-role="customer">

  <!-- TOP NAVIGATION HEADER -->
  <header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Back & Brand Logo -->
      <div class="flex items-center gap-4">
        <a href="#" class="p-2 text-slate-500 hover:text-emerald-600 hover:bg-slate-50 rounded-xl transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
          </svg>
        </a>
        <div class="flex items-center gap-2.5 border-l border-slate-200 pl-4">
          <img src="images/lifelink-logo.png" alt="LifeLink" class="h-10 w-auto object-contain">
          <div>
            <span class="text-[10px] font-bold text-slate-400 tracking-wider uppercase">Verified Quotes</span>
          </div>
        </div>
      </div>

      <!-- Right User Profile & Status -->
      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-1.5 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200/80 text-xs font-bold text-emerald-800">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span>3 Responses Received</span>
        </div>
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=120" alt="Daniel" class="w-9 h-9 rounded-full object-cover border border-slate-200 shadow-xs">
      </div>
    </div>
  </header>

  <!-- MAIN COMPARISON CONTAINER -->
  <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- PAGE HEADER -->
    <div class="text-center space-y-1.5">
      <div class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-extrabold px-3.5 py-1 rounded-full border border-emerald-200/80 mb-1">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
        <span>Real-time Marketplace Bidding</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Compare Quotes</h1>
      <p class="text-sm sm:text-base font-semibold text-slate-500 max-w-md mx-auto">Choose the professional that's right for you.</p>
    </div>

    <!-- CUSTOMER REQUEST SUMMARY BAR -->
    <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 border border-emerald-100">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-base sm:text-lg font-extrabold text-slate-900">AC repair — Not cooling properly</h2>
            <span class="text-[10px] font-extrabold bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full border border-slate-200">Request #LL-8920</span>
          </div>
          <div class="flex items-center gap-4 mt-1 text-xs font-semibold text-slate-500 flex-wrap">
            <span class="flex items-center gap-1">
              <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              </svg>
              Benin City, Edo State
            </span>
            <span>•</span>
            <span class="flex items-center gap-1">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Preferred: Today, 4:00 PM
            </span>
          </div>
        </div>
      </div>

      <button onclick="editRequest()" class="text-xs font-extrabold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-4 py-2.5 rounded-xl border border-emerald-200/80 transition shrink-0">
        Edit Request
      </button>
    </div>

    <!-- FILTER BUTTONS TABS -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1">
      <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mr-2 shrink-0">Sort By:</span>
      <button onclick="sortQuotes('best')" id="filter-best" class="filter-btn-active px-4 py-2.5 rounded-xl text-xs font-bold border border-emerald-600 transition shrink-0">
        Best match
      </button>
      <button onclick="sortQuotes('price')" id="filter-price" class="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold border border-slate-200 transition shrink-0">
        Lowest price
      </button>
      <button onclick="sortQuotes('rating')" id="filter-rating" class="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold border border-slate-200 transition shrink-0">
        Highest rated
      </button>
      <button onclick="sortQuotes('arrival')" id="filter-arrival" class="bg-white hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold border border-slate-200 transition shrink-0">
        Fastest arrival
      </button>
    </div>

    <div id="quotes-container" class="space-y-6"></div>
  </main>
<script src="lifelink.js"></script>
</body>
</html>
